<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRONTRACK - Workout & Progression</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f293d;
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-purple: #8b5cf6;
      --accent-red: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: #1f2937;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 12px; padding-bottom: 120px; -webkit-tap-highlight-color: transparent; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 16px 4px; }
    .brand-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .brand-title span { color: var(--accent-blue); }

    .header-btns { display: flex; gap: 6px; }
    .btn-header { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-header.primary { background: var(--accent-blue); border-color: var(--accent-blue); }

    /* Day Selector Tabs */
    .day-selector { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .day-selector::-webkit-scrollbar { display: none; }
    .day-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; }
    .day-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

    /* Card Layout */
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .exercise-title { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .target-badge { display: inline-block; background: #1e293b; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; }
    
    .card-actions { display: flex; gap: 6px; }
    .btn-icon { background: #1e293b; border: 1px solid var(--card-border); color: var(--text-muted); border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }
    .btn-icon.danger { color: #f87171; border-color: #451a1a; }

    /* Exercise Table */
    .set-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .set-table th { text-align: center; font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; padding-bottom: 8px; }
    .set-table td { padding: 4px 2px; text-align: center; }
    .set-num { font-size: 13px; font-weight: 600; color: var(--text-muted); width: 12%; }
    
    .input-field { width: 90%; background: var(--input-bg); border: 1px solid var(--card-border); color: #fff; padding: 10px 4px; border-radius: 10px; font-size: 15px; font-weight: 700; text-align: center; outline: none; }
    .input-field:focus { border-color: var(--accent-blue); }

    .btn-check { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-muted); border-radius: 10px; width: 42px; height: 40px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-check.completed { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }

    .btn-add-set { width: 100%; background: transparent; border: 1px dashed var(--card-border); color: var(--text-muted); padding: 8px; border-radius: 10px; font-size: 12px; font-weight: 600; margin-top: 10px; cursor: pointer; }

    /* Bottom Add Exercise Area */
    .add-ex-container { margin-top: 16px; margin-bottom: 24px; }
    .btn-add-ex { width: 100%; background: #1e293b; border: 1px solid var(--accent-blue); color: #93c5fd; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

    /* Modal Styling */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; backdrop-filter: blur(4px); }
    .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; width: 100%; max-width: 500px; padding: 20px; max-height: 85vh; overflow-y: auto; }
    .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .modal-field { margin-bottom: 12px; text-align: left; }
    .modal-field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    .modal-input { width: 100%; background: var(--input-bg); border: 1px solid var(--card-border); color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; outline: none; }

    .modal-btn { width: 100%; background: var(--accent-blue); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .modal-btn.secondary { background: transparent; border: 1px solid var(--card-border); color: var(--text-main); }
    .modal-btn.share { background: var(--accent-purple); }

    /* Progress Analytics Widgets */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat-card { background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid var(--card-border); }
    .stat-val { font-size: 20px; font-weight: 800; color: #fff; margin-top: 4px; }
    .stat-lbl { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }

    .chart-container { background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 16px; }
    .chart-title { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
    canvas { width: 100% !important; height: 160px !important; }

    .pr-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .pr-item { display: flex; justify-content: space-between; background: var(--input-bg); padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; }
    .pr-item .weight { color: var(--accent-green); font-weight: 800; }

    .history-item { background: var(--input-bg); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .history-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
    .history-body { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

    /* Local File View Code Area */
    pre { background: var(--input-bg); padding: 12px; border-radius: 10px; font-size: 11px; color: #a7f3d0; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: 220px; }

    /* Footer sticky bar */
    .sticky-footer { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(11, 15, 22, 0.95); border-top: 1px solid var(--card-border); padding: 12px 16px; backdrop-filter: blur(10px); display: flex; gap: 10px; }
    .btn-finish { flex: 1; background: var(--accent-green); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">Myfitness<span>TRACK</span></div>
    <div class="header-btns">
      <button class="btn-header primary" onclick="openModal('progressModal')">📈 Progress</button>
      <button class="btn-header" onclick="openModal('filesModal')">📁 Files</button>
    </div>
  </header>

  <!-- Day Navigation -->
  <div class="day-selector" id="daySelector"></div>

  <!-- Exercise List Area -->
  <div id="exerciseContainer"></div>

  <!-- Add Exercise Button at Bottom -->
  <div class="add-ex-container">
    <button class="btn-add-ex" onclick="openModal('addExModal')">➕ Add Custom Exercise</button>
  </div>

  <!-- Sticky Bottom Finish Bar -->
  <div class="sticky-footer">
    <button class="btn-finish" onclick="finishSession()">✓ Complete Workout Session</button>
  </div>

  <!-- MODAL: Add Custom Exercise -->
  <div class="modal-overlay" id="addExModal">
    <div class="modal-card">
      <div class="modal-title">Add Exercise <span style="cursor:pointer" onclick="closeModal('addExModal')">✕</span></div>
      <div class="modal-field">
        <label>EXERCISE NAME</label>
        <input type="text" id="newExName" class="modal-input" placeholder="e.g. Incline Dumbbell Press">
      </div>
      <div class="modal-field">
        <label>TARGET REPS</label>
        <input type="text" id="newExTarget" class="modal-input" placeholder="e.g. 3 × 8-10">
      </div>
      <div class="modal-field">
        <label>INITIAL SETS COUNT</label>
        <input type="number" id="newExSets" class="modal-input" value="3" min="1" max="10">
      </div>
      <button class="modal-btn" onclick="addCustomExercise()">Save Exercise</button>
    </div>
  </div>

  <!-- MODAL: Progress & Analytics Tracker -->
  <div class="modal-overlay" id="progressModal">
    <div class="modal-card">
      <div class="modal-title">Progress & Analytics <span style="cursor:pointer" onclick="closeModal('progressModal')">✕</span></div>
      
      <!-- Key Stats Summary -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-lbl">Total Workouts</div>
          <div class="stat-val" id="statTotalWorkouts">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">Lifetime Volume</div>
          <div class="stat-val" id="statTotalVolume">0 kg</div>
        </div>
      </div>

      <!-- Volume Chart -->
      <div class="chart-container">
        <div class="chart-title">Volume Over Time (kg)</div>
        <canvas id="volumeChart"></canvas>
      </div>

      <!-- Personal Records -->
      <div class="modal-field">
        <label>PERSONAL RECORDS (MAX WEIGHT LIFTED)</label>
        <div class="pr-list" id="prList">
          <div style="font-size:12px; color:var(--text-muted);">No records logged yet. Complete workouts to calculate PRs!</div>
        </div>
      </div>

      <!-- Recent History Logs -->
      <div class="modal-field">
        <label>RECENT LOGGED SESSIONS</label>
        <div id="historyList"></div>
      </div>

      <button class="modal-btn secondary" onclick="closeModal('progressModal')">Close</button>
    </div>
  </div>

  <!-- MODAL: Local Files & CSV -->
  <div class="modal-overlay" id="filesModal">
    <div class="modal-card">
      <div class="modal-title">Local Workout Files <span style="cursor:pointer" onclick="closeModal('filesModal')">✕</span></div>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">Stored directly in your browser's local memory storage.</p>
      <pre id="csvPreview">Loading data...</pre>
      
      <button class="modal-btn share" style="margin-top:12px" onclick="shareCSV()">📤 Share / Send CSV File</button>
      <button class="modal-btn" style="margin-top:8px" onclick="downloadCSV()">⬇️ Save CSV File to Device</button>
      <button class="modal-btn secondary" style="margin-top:8px" onclick="closeModal('filesModal')">Close</button>
    </div>
  </div>

  <script>
    // Initial Default Routine Data Structure
    const defaultRoutines = {
      Monday: [
        { name: "Bench Press", target: "4 × 6–8", sets: [ {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false} ] },
        { name: "Incline DB Press", target: "3 × 8–10", sets: [ {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false} ] },
        { name: "Lat Pulldown", target: "4 × 8–10", sets: [ {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false} ] },
        { name: "Chest-Supported Row", target: "3 × 8–10", sets: [ {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false} ] },
        { name: "High-to-Low Cable Fly", target: "3 × 12–15", sets: [ {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false} ] },
        { name: "Straight-Arm Pulldown", target: "3 × 12–15", sets: [ {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false}, {kg: "", reps: "", done: false} ] }
      ],
      Tuesday: [
        { name: "DB Shoulder Press", target: "3 × 8–10", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "Lateral Raise", target: "4 × 12–15", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "Reverse Pec Deck", target: "3 × 12–15", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "EZ Bar Curl", target: "3 × 10–12", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "Rope Tricep Pushdown", target: "3 × 12–15", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] }
      ],
      Wednesday: [
        { name: "Easy Cardio (Zone 2)", target: "20-30 mins", sets: [{kg:"0",reps:"30",done:false}] },
        { name: "Hanging Leg Raises", target: "3 × 10–15", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] }
      ],
      Thursday: [
        { name: "Incline Barbell Press", target: "3 × 6–8", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "Pull-ups", target: "4 × 6–10", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "T-Bar Row", target: "3 × 8–10", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "Machine Chest Press", target: "3 × 10–12", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] }
      ],
      Friday: [
        { name: "Standing Barbell OHP", target: "3 × 6–8", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "Cable Lateral Raise", target: "4 × 12–15", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "Preacher Curl", target: "3 × 10–12", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "Close-Grip Bench", target: "3 × 8–10", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] }
      ],
      Saturday: [
        { name: "Back Squat", target: "4 × 6–8", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "Romanian Deadlift", target: "3 × 8–10", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "Leg Press", target: "3 × 10–12", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] },
        { name: "Seated Leg Curl", target: "3 × 10–15", sets: [{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}] }
      ]
    };

    let activeDay = "Monday";
    let store = JSON.parse(localStorage.getItem('irontrack_store')) || { routines: defaultRoutines, logs: [] };

    function init() {
      renderDays();
      renderExercises();
    }

    function renderDays() {
      const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const container = document.getElementById('daySelector');
      container.innerHTML = days.map(d => 
        `<button class="day-btn ${d === activeDay ? 'active' : ''}" onclick="switchDay('${d}')">${d}</button>`
      ).join('');
    }

    function switchDay(day) {
      activeDay = day;
      renderDays();
      renderExercises();
    }

    function renderExercises() {
      const container = document.getElementById('exerciseContainer');
      const list = store.routines[activeDay] || [];

      if (list.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; color: var(--text-muted);">No exercises for ${activeDay}. Tap below to add one!</div>`;
        return;
      }

      container.innerHTML = list.map((ex, exIdx) => `
        <div class="card">
          <div class="card-header">
            <div>
              <div class="exercise-title">${ex.name}</div>
              <span class="target-badge">Target: ${ex.target}</span>
            </div>
            <div class="card-actions">
              <button class="btn-icon danger" title="Delete Exercise" onclick="deleteExercise(${exIdx})">🗑️</button>
            </div>
          </div>

          <table class="set-table">
            <thead>
              <tr>
                <th>Set</th>
                <th>KG</th>
                <th>Reps</th>
                <th>Done</th>
              </tr>
            </thead>
            <tbody>
              ${ex.sets.map((s, sIdx) => `
                <tr>
                  <td class="set-num">${sIdx + 1}</td>
                  <td><input type="number" class="input-field" value="${s.kg}" placeholder="0" onchange="updateSet(${exIdx}, ${sIdx}, 'kg', this.value)"></td>
                  <td><input type="number" class="input-field" value="${s.reps}" placeholder="0" onchange="updateSet(${exIdx}, ${sIdx}, 'reps', this.value)"></td>
                  <td><button class="btn-check ${s.done ? 'completed' : ''}" onclick="toggleSet(${exIdx}, ${sIdx})">✓</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          
          <div style="display:flex; gap:8px;">
            <button class="btn-add-set" onclick="addSet(${exIdx})">+ Add Set</button>
            ${ex.sets.length > 1 ? `<button class="btn-add-set" style="color:#f87171;" onclick="removeSet(${exIdx})">- Remove Set</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    function updateSet(exIdx, sIdx, field, val) {
      store.routines[activeDay][exIdx].sets[sIdx][field] = val;
      saveLocal();
    }

    function toggleSet(exIdx, sIdx) {
      const current = store.routines[activeDay][exIdx].sets[sIdx].done;
      store.routines[activeDay][exIdx].sets[sIdx].done = !current;
      saveLocal();
      renderExercises();
    }

    function addSet(exIdx) {
      const sets = store.routines[activeDay][exIdx].sets;
      const lastSet = sets[sets.length - 1] || { kg: "", reps: "" };
      sets.push({ kg: lastSet.kg, reps: lastSet.reps, done: false });
      saveLocal();
      renderExercises();
    }

    function removeSet(exIdx) {
      store.routines[activeDay][exIdx].sets.pop();
      saveLocal();
      renderExercises();
    }

    function deleteExercise(exIdx) {
      if (confirm(`Delete ${store.routines[activeDay][exIdx].name} from ${activeDay}?`)) {
        store.routines[activeDay].splice(exIdx, 1);
        saveLocal();
        renderExercises();
      }
    }

    function addCustomExercise() {
      const name = document.getElementById('newExName').value.trim();
      const target = document.getElementById('newExTarget').value.trim() || "3 × 8-12";
      const setNum = parseInt(document.getElementById('newExSets').value) || 3;

      if (!name) return alert("Please enter an exercise name.");

      const newSets = [];
      for (let i = 0; i < setNum; i++) {
        newSets.push({ kg: "", reps: "", done: false });
      }

      if (!store.routines[activeDay]) store.routines[activeDay] = [];
      store.routines[activeDay].push({ name, target, sets: newSets });

      saveLocal();
      closeModal('addExModal');
      document.getElementById('newExName').value = '';
      renderExercises();
    }

    function finishSession() {
      const today = new Date().toISOString().split('T')[0];
      const currentRoutine = store.routines[activeDay];
      
      // Calculate Session Total Volume
      let totalVol = 0;
      currentRoutine.forEach(ex => {
        ex.sets.forEach(s => {
          if (s.done || s.kg) {
            totalVol += (parseFloat(s.kg) || 0) * (parseInt(s.reps) || 0);
          }
        });
      });

      const session = { 
        date: today, 
        day: activeDay, 
        volume: totalVol,
        exercises: JSON.parse(JSON.stringify(currentRoutine)) 
      };
      
      store.logs.push(session);
      
      // Reset completed status for next time
      store.routines[activeDay].forEach(ex => ex.sets.forEach(s => s.done = false));
      saveLocal();

      // Offer to Share Workout Summary
      const shareTxt = formatShareText(session);
      if (confirm(`Workout completed! Total Volume: ${totalVol} kg.\n\nWould you like to share this session summary?`)) {
        shareWorkoutText(shareTxt);
      }

      renderExercises();
    }

    function formatShareText(session) {
      let txt = `🏋️ IRONTRACK Workout Summary\n📅 Date: ${session.date} (${session.day})\n🔥 Volume: ${session.volume || 0} kg\n--------------------------\n`;
      session.exercises.forEach(ex => {
        const completedSets = ex.sets.filter(s => s.kg || s.reps);
        if (completedSets.length > 0) {
          txt += `• ${ex.name}:\n`;
          completedSets.forEach((s, i) => {
            txt += `   Set ${i+1}: ${s.kg || 0}kg × ${s.reps || 0} reps\n`;
          });
        }
      });
      txt += `\nTracked with IRONTRACK`;
      return txt;
    }

    function shareWorkoutText(text) {
      if (navigator.share) {
        navigator.share({ title: 'Workout Summary', text: text }).catch(() => {});
      } else {
        copyToClipboard(text);
        alert("Workout summary copied to clipboard! You can now paste it into WhatsApp or Messages.");
      }
    }

    function copyToClipboard(text) {
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
    }

    function saveLocal() {
      localStorage.setItem('irontrack_store', JSON.stringify(store));
    }

    function openModal(id) {
      if (id === 'progressModal') renderProgressStats();
      if (id === 'filesModal') generateCSVPreview();
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function renderProgressStats() {
      // Total stats
      document.getElementById('statTotalWorkouts').textContent = store.logs.length;
      
      let lifetimeVol = 0;
      const prs = {};

      store.logs.forEach(log => {
        lifetimeVol += log.volume || 0;
        log.exercises.forEach(ex => {
          ex.sets.forEach(s => {
            const kg = parseFloat(s.kg) || 0;
            if (kg > 0) {
              if (!prs[ex.name] || kg > prs[ex.name]) {
                prs[ex.name] = kg;
              }
            }
          });
        });
      });

      document.getElementById('statTotalVolume').textContent = `${lifetimeVol.toLocaleString()} kg`;

      // Render PRs
      const prContainer = document.getElementById('prList');
      const prKeys = Object.keys(prs);
      if (prKeys.length === 0) {
        prContainer.innerHTML = `<div style="font-size:12px; color:var(--text-muted);">No weight data recorded yet.</div>`;
      } else {
        prContainer.innerHTML = prKeys.map(k => `
          <div class="pr-item">
            <span>${k}</span>
            <span class="weight">${prs[k]} kg</span>
          </div>
        `).join('');
      }

      // Render Recent Logs
      const histContainer = document.getElementById('historyList');
      if (store.logs.length === 0) {
        histContainer.innerHTML = `<div style="font-size:12px; color:var(--text-muted);">No history logged yet.</div>`;
      } else {
        histContainer.innerHTML = store.logs.slice().reverse().slice(0, 5).map(log => `
          <div class="history-item">
            <div class="history-header">
              <span>${log.day} (${log.date})</span>
              <span style="color:var(--accent-green);">${log.volume || 0} kg</span>
            </div>
            <div class="history-body">
              ${log.exercises.map(e => `${e.name} (${e.sets.length} sets)`).join(', ')}
            </div>
            <button class="btn-add-set" style="margin-top:6px;" onclick="shareWorkoutText(formatShareText(store.logs[${store.logs.indexOf(log)}]))">📤 Share Session</button>
          </div>
        `).join('');
      }

      renderVolumeChart();
    }

    function renderVolumeChart() {
      const canvas = document.getElementById('volumeChart');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const logs = store.logs.slice(-7); // Last 7 sessions
      if (logs.length < 2) {
        ctx.fillStyle = "#9ca3af";
        ctx.font = "12px sans-serif";
        ctx.fillText("Log 2+ workouts to render volume graph", 20, 80);
        return;
      }

      const padding = 30;
      const w = canvas.width = canvas.offsetWidth;
      const h = canvas.height = 160;

      const maxVol = Math.max(...logs.map(l => l.volume || 100), 100);
      
      ctx.beginPath();
      ctx.strokeStyle = "#2563eb";
      ctx.lineWidth = 3;

      logs.forEach((log, i) => {
        const x = padding + (i / (logs.length - 1)) * (w - padding * 2);
        const y = h - padding - ((log.volume || 0) / maxVol) * (h - padding * 2);

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);

        // Draw points
        ctx.fillStyle = "#60a5fa";
        ctx.fillRect(x - 3, y - 3, 6, 6);
      });

      ctx.stroke();
    }

    function generateCSVPreview() {
      let csv = "Date,Day,Exercise,Set,WeightKG,Reps\n";
      store.logs.forEach(log => {
        log.exercises.forEach(ex => {
          ex.sets.forEach((s, i) => {
            if (s.kg || s.reps) {
              csv += `${log.date},${log.day},"${ex.name}",${i + 1},${s.kg || 0},${s.reps || 0}\n`;
            }
          });
        });
      });

      if (store.logs.length === 0) csv = "No completed sessions logged yet. Complete workouts to generate history.";
      document.getElementById('csvPreview').textContent = csv;
    }

    function shareCSV() {
      let csv = "Date,Day,Exercise,Set,WeightKG,Reps\n";
      store.logs.forEach(log => {
        log.exercises.forEach(ex => {
          ex.sets.forEach((s, i) => {
            csv += `${log.date},${log.day},"${ex.name}",${i + 1},${s.kg || 0},${s.reps || 0}\n`;
          });
        });
      });

      if (navigator.share) {
        const file = new File([csv], `irontrack_log.csv`, { type: 'text/csv' });
        navigator.share({ title: 'Workout Data CSV', files: [file] }).catch(() => downloadCSV());
      } else {
        downloadCSV();
      }
    }

    function downloadCSV() {
      let csv = "Date,Day,Exercise,Set,WeightKG,Reps\n";
      store.logs.forEach(log => {
        log.exercises.forEach(ex => {
          ex.sets.forEach((s, i) => {
            csv += `${log.date},${log.day},"${ex.name}",${i + 1},${s.kg || 0},${s.reps || 0}\n`;
          });
        });
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `irontrack_log_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    init();
  </script>
</body>
</html>
